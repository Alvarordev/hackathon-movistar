# Construye y publica las imágenes en GHCR. Dokploy las consume por tag.
#
# Dos imágenes:
#   copiloto-nbo-web  — Next.js standalone (~318 MB)
#   copiloto-nbo-db   — Postgres con la base ya sembrada (~471 MB)
#
# El pipeline de ML NO corre acá: los datos vienen precalculados en
# deploy/nbo.sql.gz, que se regenera en local con `mise run dump`.

name: Publicar imágenes

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: web
            contexto: ./web
            dockerfile: ./web/Dockerfile.prod
          - nombre: db
            # La imagen de la base necesita deploy/nbo.sql.gz, que está en la
            # raíz. El .dockerignore de la raíz recorta el contexto a ese
            # único archivo para no subir los 63 MB de CSV.
            contexto: .
            dockerfile: ./db/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/copiloto-nbo-${{ matrix.nombre }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

  # El despliegue lo dispara ESTE workflow, no el push.
  #
  # Dokploy también puede escuchar el push de git, pero entonces redespliega
  # mientras las imágenes todavía se están construyendo: el build tarda ~2
  # minutos y el deploy llegaba veinte segundos antes de que `latest` existiera,
  # así que publicaba la versión anterior y se quedaba ahí. Si el auto-deploy
  # por git sigue activo en el panel, conviene apagarlo: este job lo reemplaza.
  desplegar:
    needs: publicar
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Avisar a Dokploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Falta el secret DOKPLOY_WEBHOOK: no se despliega."
            echo "Se toma de Dokploy > la aplicación > Deployments > Webhook URL."
            exit 1
          fi
          codigo=$(curl -sS -o /tmp/respuesta -w '%{http_code}' -X POST "$WEBHOOK")
          echo "HTTP $codigo"; cat /tmp/respuesta; echo
          [ "$codigo" -lt 400 ]
