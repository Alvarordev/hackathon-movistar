[tools]
python = "3.12"
node = "24"

[env]
_.file = ".env"

[tasks.up]
description = "Levanta db + web"
run = "docker compose up -d db web"

[tasks.down]
description = "Baja todo"
run = "docker compose down"

[tasks.logs]
description = "Logs de web"
run = "docker compose logs -f web"

[tasks.seed]
description = "Carga CSVs y artefactos a Postgres (idempotente)"
run = "docker compose run --rm pipeline python -m src.seed"

[tasks.pipeline]
description = "Corre el pipeline completo: features, modelos, clustering, scoring, artefactos"
run = "docker compose run --rm pipeline python -m src.run_all"

[tasks.psql]
description = "Shell de Postgres"
run = "docker compose exec db psql -U nbo -d nbo"

[tasks.verify]
description = "Verifica que la API cumple el contrato"
run = "./scripts/verify_contrato.sh"
