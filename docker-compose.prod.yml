# Despliegue en VPS con Dokploy.
#
# Diferencias con docker-compose.yml (desarrollo):
#   - Imágenes de GHCR, sin `build` ni montajes de código fuente.
#   - Postgres NO publica puerto: solo se le llega por la red interna.
#   - NODE_ENV=production.
#   - Techos de memoria: el VPS comparte 4 GB con la producción de otro
#     proyecto, y sin límites un pico nuestro haría que el OOM killer del
#     kernel matara contenedores ajenos.
#   - Sin servicio `pipeline`: el VPS solo sirve la app. Los datos vienen ya
#     calculados dentro de la imagen de la base.
#
# Variables que Dokploy debe inyectar (nunca en el repo):
#   IMAGE_TAG, POSTGRES_PASSWORD, AI_PROVIDER, AI_MODEL,
#   GOOGLE_GENERATIVE_AI_API_KEY

name: copiloto-nbo

services:
  db:
    image: ${IMAGE_DB:-ghcr.io/alvarordev/copiloto-nbo-db}:${IMAGE_TAG:-latest}
    # Sin esto, un `up -d` reusa la imagen que ya tiene en disco y `latest`
    # nunca se mueve: Docker solo baja una imagen cuando le falta, no cuando
    # cambió en el registry. Un redeploy parecía funcionar —terminaba en 0s— y
    # seguía sirviendo la versión anterior.
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nbo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nbo} -d ${POSTGRES_DB:-nbo}"]
      # La primera vez restaura 25 MB comprimidos: se le da margen con
      # start_period para que no lo declaren enfermo mientras siembra.
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    # Se mide en ~90-120 MB sirviendo, pero el límite cubre además el pico
    # puntual del primer arranque, cuando restaura el dump y crea los índices
    # de nbo_scores (597k filas).
    mem_limit: 512m
    restart: unless-stopped

  web:
    image: ${IMAGE_WEB:-ghcr.io/alvarordev/copiloto-nbo-web}:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nbo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nbo}
      NODE_ENV: production
      AI_PROVIDER: ${AI_PROVIDER:-google}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # SIN `ports`: no se publica nada al host.
    #
    # Traefik llega al contenedor por la red interna de Docker, así que
    # publicar el puerto no aporta nada y además choca — el 3000 del host lo
    # ocupa la propia interfaz de Dokploy. Como efecto secundario, la app solo
    # es accesible por el dominio y no por IP:puerto.
    expose:
      - "3000"
    networks:
      - default          # para hablar con `db`
      - dokploy-network  # para que Traefik la encuentre
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Medido en 57-64 MB con el build standalone. 256 MB es 4x eso: suficiente
    # margen para un pico real, pero lo bastante ajustado como para que una
    # fuga nuestra muera acá y no arrastre a los contenedores vecinos.
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata:

networks:
  # La crea Dokploy en el VPS y es donde vive Traefik. `db` NO se conecta acá:
  # se queda en la red interna, inalcanzable desde fuera.
  #
  # Para probar este compose en local hace falta crearla antes (es idempotente):
  #   docker network create dokploy-network
  dokploy-network:
    external: true
